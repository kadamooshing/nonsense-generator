<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="九天廢話">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>九天廢話文學生成器</title>
<style>
:root{--bg:#0f0f10;--card:#19191c;--muted:#9a9aa1;--text:#f5f5f7;--line:#2b2b30;--accent:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif}
.app{max-width:720px;margin:auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
.header{padding:8px 2px 16px}.header h1{margin:0;font-size:28px}.badge{font-size:11px;background:#fff;color:#111;padding:3px 7px;border-radius:999px;vertical-align:middle}
.header p,.small{color:var(--muted);font-size:13px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:92px;resize:none;border:1px solid var(--line);background:#111114;color:var(--text);border-radius:14px;font-size:17px;padding:13px 14px;outline:none;line-height:1.5}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0}.chip{white-space:nowrap;background:#232328;border:1px solid #303036;color:#ddd;padding:9px 11px;border-radius:999px;font-size:13px;font-weight:700}.chip.active{background:#f1f1f3;color:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{border:0;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:700;cursor:pointer}
.primary{width:100%;background:var(--accent);color:#111;margin-top:12px;font-size:18px;padding:15px}
.secondary{background:#27272c;color:var(--text);border:1px solid #34343a}.ghost{background:#202024;color:var(--text);border:1px solid #303036}
.output{display:flex;flex-direction:column;gap:10px}.result{background:#111114;border:1px solid var(--line);border-radius:16px;padding:14px}
.resultText{font-size:17px;line-height:1.65;white-space:pre-wrap;margin-bottom:12px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:10px;font-size:14px}
.keywords{margin-top:10px;color:#777;font-size:12px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(18px);background:#fff;color:#111;padding:10px 14px;border-radius:999px;font-weight:700;opacity:0;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%)}
.footer{color:#777;font-size:12px;text-align:center;padding:8px}
</style>
</head>
<body>
<div class="app">
 <div class="header"><h1>九天廢話文學生成器 <span class="badge">V2.5</span></h1><p>語意組合＋多邏輯骨架＋近期去重。全離線，不需要模型。</p></div>
 <div class="card">
  <label>對方原話／主題</label><textarea id="topic" placeholder="貼上對方原話……"></textarea>
  <label style="margin-top:12px">風格</label>
  <div class="chips" id="chips">
   <button class="chip active" data-style="normal">經典廢</button><button class="chip" data-style="argue">回嘴廢</button>
   <button class="chip" data-style="philo">哲學廢</button><button class="chip" data-style="science">研究廢</button>
   <button class="chip" data-style="mystic">高深廢</button><button class="chip" data-style="romance">浪漫廢</button>
   <button class="chip" data-style="god">神級廢</button>
  </div>
  <div class="row"><button class="secondary" id="sampleBtn">換個範例</button><button class="ghost" id="clearBtn">清空</button></div>
  <button class="primary" id="generateBtn">生成 3 句</button>
  <div class="keywords" id="keywords"></div>
 </div>
 <div class="card"><label>生成結果</label><div class="output" id="output"></div></div>
 <div class="footer">V2.5：先組成完整概念再廢，避免把「繩子」和「不夠力」硬拆開。</div>
</div><div class="toast" id="toast">已複製</div>
<script>
const $=id=>document.getElementById(id), topicEl=$('topic'), output=$('output'), toast=$('toast'), keywordsEl=$('keywords');
let style='normal'; const recent=new Set(); const recentOrder=[];

const samples=[
'你整天研究這些賺到錢了嗎？','你是不是有病？','你到底在講什麼？',
'我忘記了，你那個繩子不夠力，頭放下去結果身體扯斷了',
'馬賽克打好了，不用謝我','躲好，子彈飛啊飛的',
'走在香水雨裡，濕的是我的身，思的是你的人',
'情愛是互相吸引，互相吸引又是為了什麼？'
];

const stop = new Set('我你妳他她它我們你們他們這那這個那個一個一些就是只是但是不過因為所以如果然後結果現在目前已經還是沒有不是可以可能真的其實到底怎麼什麼為什麼一下這樣那樣的了嗎呢啊呀喔哦吧在有又都也很太再就把被讓跟和與或而才會能要想說講問看做去來上下一樣時候事情問題地方'.split(''));

const lexicon = [
'香水雨','街燈','浪漫','芬芳氣息','氣息','走進妳的心裡','走進你的心裡','心裡','心裏','淋濕','淋溼','洗淨',
'婚姻','契約','情愛','互相吸引','吸引','繩子不夠力','繩子','不夠力','頭放下去','頭','身體扯斷','身體','扯斷',
'子彈飛','子彈','躲好','馬賽克','研究','賺到錢','賺錢','神助的力量','神助','力量','經典','感應','板規',
'熬夜','喝水','胃口','困難','背後','生病','答案','時間','成功','失敗','離開','回來','忘記','記得'
];

const semanticRules = [
 {test:/繩子[^，。！？]{0,8}(不夠力|不夠|斷|撐不住)/, make:m=>`繩子${m[1]}`},
 {test:/頭[^，。！？]{0,6}(放下去|放下|低下|伸下去)/, make:m=>`頭${m[1]}`},
 {test:/身體[^，。！？]{0,8}(扯斷|斷了|斷掉|被扯斷)/, make:m=>m[1].startsWith('被')?`身體${m[1]}`:`身體${m[1]}`},
 {test:/(香水雨)[^，。！？]{0,12}(淋|落|濕)/, make:m=>`${m[1]}${m[2]}在身上`},
 {test:/(走進|進入)[^，。！？]{0,5}(妳|你)[^，。！？]{0,4}(心裡|心裏)/, make:m=>`${m[1]}${m[2]}的${m[3]}`},
 {test:/(情愛|愛情)[^，。！？]{0,8}(互相吸引|吸引)/, make:m=>`${m[1]}是${m[2]}`},
 {test:/(婚姻)[^，。！？]{0,8}(契約)/, make:m=>`${m[1]}是${m[2]}`},
 {test:/(研究)[^，。！？]{0,12}(賺到錢|賺錢)/, make:m=>`${m[1]}能不能${m[2]}`},
 {test:/(板規)[^，。！？]{0,12}(感應)/, make:m=>`${m[1]}不能講${m[2]}`},
 {test:/(經典)[^，。！？]{0,15}(神助|力量|感應)/, make:m=>`讀${m[1]}感到${m[2]}`},
 {test:/(馬賽克)[^，。！？]{0,8}(打好|打了|遮住)/, make:m=>`${m[1]}${m[2]}`},
 {test:/(子彈)[^，。！？]{0,8}(飛|飛過去|飛來飛去)/, make:m=>`${m[1]}${m[2]}`}
];

function clean(s){return (s||'').replace(/\s+/g,' ').trim().replace(/[。！？!?]+$/,'')}
function uniq(arr){return [...new Set(arr.filter(Boolean))]}
function semanticPhrases(raw){
 const s=clean(raw), phrases=[];
 semanticRules.forEach(r=>{const m=s.match(r.test); if(m) phrases.push(r.make(m))});
 // Preserve useful clause-sized events.
 s.split(/[，,。；;！？!?]+/).map(x=>x.trim()).filter(x=>x.length>=3&&x.length<=18).forEach(c=>{
   c=c.replace(/^(可是|但是|不過|所以|因為|如果|然後|結果|其實|我覺得|我希望)/,'').trim();
   if(c && !/^(我|你|妳)$/.test(c)) phrases.push(c);
 });
 // Known compound concepts.
 lexicon.sort((a,b)=>b.length-a.length).forEach(w=>{if(s.includes(w)) phrases.push(w)});
 return uniq(phrases).sort((a,b)=>b.length-a.length).slice(0,8);
}
function extract(raw){
 const s=clean(raw), found=semanticPhrases(s);
 if(found.length<3){
   const chunks=s.split(/[，,。；;：:、！？!?（）()\s]+/).map(x=>x.trim()).filter(x=>x.length>=2&&x.length<=12);
   chunks.forEach(c=>{if(!stop.has(c)&&!found.includes(c))found.push(c)});
 }
 return uniq(found).slice(0,8);
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function pair(k){
 const fallback='這件事';
 return [k[0]||fallback,k[1]||k[0]||fallback,k[2]||k[1]||k[0]||fallback];
}
function addRecent(x){recent.add(x);recentOrder.push(x);while(recentOrder.length>45){recent.delete(recentOrder.shift())}}
function chooseUnique(builders, ctx){
 for(let i=0;i<60;i++){let x=pick(builders)(ctx); if(!recent.has(x)){addRecent(x);return x}}
 let x=pick(builders)(ctx); addRecent(x); return x;
}

// Phrase-aware helpers: choose a natural subject/event rather than a naked adjective.
function subject(ctx){
 return ctx.k.find(x=>!/^(不夠力|浪漫|力量|感應|吸引|忘記|記得)$/.test(x)) || ctx.a;
}
function event2(ctx){
 return ctx.k.find((x,i)=>i>0 && x!==subject(ctx) && x.length>=3) || ctx.b;
}
function ending(ctx){
 return ctx.k.find((x,i)=>i>1 && /(斷|結果|心|錢|力量|感應|發生|離開|回來|打好|飛)/.test(x)) || ctx.c;
}

const B={
normal:[
 c=>`${subject(c)}最大的特點，就是事情一旦真的走到這裡，現在就不能再說它完全沒走到這裡。`,
 c=>`如果${subject(c)}還沒發生，那它目前就是還沒發生；等${event2(c)}真的出現，至少前面的「還沒」就少了一個。`,
 c=>`${subject(c)}本身未必能說明全部，但${event2(c)}一出現，至少可以確定事情沒有停在原來那一步。`,
 c=>`先不談${ending(c)}，光是${subject(c)}已經發生，就足以證明${subject(c)}不是完全沒發生。`,
 c=>`事情到了「${subject(c)}」這一步，最明顯的變化就是：現在確實已經到了這一步。`,
 c=>`能從${subject(c)}一路講到${event2(c)}，至少證明這兩件事已經成功被放進同一段故事裡。`
],
argue:[
 c=>`你先別急著談${event2(c)}，因為${subject(c)}如果都還沒講清楚，後面的結論再急也只能先排隊。`,
 c=>`你要把${subject(c)}理解成${event2(c)}當然可以，至少目前最確定的是：你真的已經這樣理解了。`,
 c=>`我沒有迴避${subject(c)}，我只是把它放在一個看起來非常像被迴避的位置。`,
 c=>`你問${subject(c)}有沒有道理，我只能說：有道理的部分確實有道理，剩下的部分目前還在剩下。`,
 c=>`如果${subject(c)}真的能證明${event2(c)}，那很好；如果不能，至少證明你很想拿前者證明後者。`,
 c=>`你可以不同意${subject(c)}，但在你不同意之前，它至少已經成功讓你產生了一次不同意。`
],
philo:[
 c=>`人總以為自己在追問${subject(c)}，其實追到最後，首先找到的是那個一直在追問的人。`,
 c=>`${subject(c)}若沒有${event2(c)}，也許故事會停在前面；有了後者之後，至少故事已經沒有停在前面。`,
 c=>`放下${subject(c)}之前，它通常還在；真正放下之後，至少不用再一直拿著它證明自己還沒放下。`,
 c=>`我們以為${subject(c)}通往${ending(c)}，後來才發現，在結果到來之前，每一步都還只是結果到來以前。`,
 c=>`真正值得思考的不是${subject(c)}為什麼發生，而是當你開始思考時，它已經成了發生過、可以被思考的事。`,
 c=>`${subject(c)}會過去，${event2(c)}也會過去；等它們都過去，留下來的至少是它們曾經沒有一直沒發生。`
],
science:[
 c=>`根據長期觀察，${subject(c)}一旦和${event2(c)}同時出現在同一事件裡，兩者同時出現的機率會高於它們完全沒出現的時候。`,
 c=>`實驗顯示，${subject(c)}沒有發生之前，其發生率通常偏低；一旦${event2(c)}也出現，樣本至少正式多了一件事。`,
 c=>`目前沒有證據證明${subject(c)}與${event2(c)}毫無關係，尤其是在它們已經被當事人一起講出來的情況下。`,
 c=>`統計指出，提到${subject(c)}的人，比完全沒提到它的人，更容易在自己的句子裡提到它。`,
 c=>`研究人員發現，只要${subject(c)}真的發生，受試者處於「這件事已經發生」狀態的比例會快速上升。`,
 c=>`初步數據顯示，${event2(c)}能不能導致${ending(c)}仍待研究；但如果結果已經出現，至少樣本數不再是零。`
],
mystic:[
 c=>`你看到的是${subject(c)}，想到的是${event2(c)}；但真正先被你看見的，是你正在看見這件事。`,
 c=>`${subject(c)}不是答案，${event2(c)}也不是答案；可當它們連在一起，至少問題突然多了兩個可以繼續問的地方。`,
 c=>`當${subject(c)}出現時，不必急著追問它從哪裡來；因為在你追問以前，它至少已經先來了。`,
 c=>`萬事皆有因果，${subject(c)}若是因，${ending(c)}未必是果；但如果後者真的成了結果，那它至少已經結果了。`,
 c=>`真正的${subject(c)}不在遠方，它就在這件事發生的地方；你若找不到，至少目前還沒找到。`,
 c=>`你以為自己放不下${subject(c)}，其實也可能只是這件事目前還沒有被你放下。`
],
romance:[
 c=>`${subject(c)}落在故事裡只是故事，落進心裡才成了想念；至於${event2(c)}，因為想的是你，繞到最後還是會繞回你。`,
 c=>`我沒有躲開${subject(c)}，因為躲開了就碰不到它；碰不到它，又怎麼帶著這一路的氣息靠近你。`,
 c=>`濕的是我的身，留下的是${subject(c)}；我以為自己走向${event2(c)}，後來才發現，真正一直沒離開的是心裡那個你。`,
 c=>`${subject(c)}可以洗掉氣息，卻洗不掉想念；如果最後真的走到${ending(c)}，至少這一路沒有完全白走。`,
 c=>`浪漫不是${subject(c)}本身，而是它發生的時候，我剛好還在想你；不然它頂多只是${subject(c)}。`,
 c=>`我把${subject(c)}留給夜色，把${event2(c)}留給心裡；如果你問還剩什麼，剩下的就是還沒說完的那一點想你。`
],
god:[
 c=>`${subject(c)}最大的問題，就是它真的發生了；等${ending(c)}也出現以後，你會發現——現在回頭討論前面夠不夠，多少已經有點晚了。`,
 c=>`先有${subject(c)}，再有${event2(c)}，最後得到一個重要結論：沒有前面的事，後面的事至少不會用完全同樣的方式發生。`,
 c=>`我本來也沒想到${subject(c)}，直到${event2(c)}出現，我才明白——有些事情不知道的時候，確實比較不知道。`,
 c=>`別小看${subject(c)}，它只要成功一次，就能把「還沒發生」直接改寫成「剛剛發生過」。`,
 c=>`${subject(c)}跟${event2(c)}誰比較重要我不知道，但可以確定：少了其中一個，這句廢話會短很多。`,
 c=>`如果最後${subject(c)}還是沒能避免${ending(c)}，至少我們成功用前面的過程證明了：結果確實已經來了。`
]};

function context(raw){
 const k=extract(raw), [a,b,c]=pair(k);
 const ctx={raw:clean(raw)||'這件事',k,a,b,c};
 keywordsEl.textContent='抓到的語意組合：'+k.slice(0,6).join('・');
 return ctx;
}
function generateOne(ctx){return chooseUnique(B[style],ctx)}
function generate(){
 const ctx=context(topicEl.value);
 const arr=[]; while(arr.length<3){let x=generateOne(ctx); if(!arr.includes(x))arr.push(x)}
 render(arr,ctx);
}
function render(items,ctx){
 output.innerHTML='';
 items.forEach(text=>{
  const box=document.createElement('div');box.className='result';
  const t=document.createElement('div');t.className='resultText';t.textContent=text;
  const a=document.createElement('div');a.className='actions';
  const cp=document.createElement('button');cp.className='secondary';cp.textContent='複製這句';
  const ag=document.createElement('button');ag.className='ghost';ag.textContent='換一句';
  const bind=x=>{cp.onclick=()=>copyText(x);ag.onclick=()=>{let n=generateOne(ctx);t.textContent=n;bind(n)}};
  bind(text);a.append(cp,ag);box.append(t,a);output.append(box);
 });
}
async function copyText(text){
 try{await navigator.clipboard.writeText(text)}catch(e){let ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
 toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)
}
$('generateBtn').onclick=generate;
$('clearBtn').onclick=()=>{topicEl.value='';keywordsEl.textContent='';output.innerHTML='';topicEl.focus()};
$('sampleBtn').onclick=()=>{topicEl.value=pick(samples);generate()};
$('chips').addEventListener('click',e=>{if(!e.target.classList.contains('chip'))return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');style=e.target.dataset.style;generate()});
topicEl.value='我忘記了，你那個繩子不夠力，頭放下去結果身體扯斷了';generate();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
