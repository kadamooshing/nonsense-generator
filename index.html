<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>九天廢話文學生成器</title>
<style>
:root{--bg:#0f0f10;--card:#19191c;--muted:#9a9aa1;--text:#f5f5f7;--line:#2b2b30;--accent:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif}
.app{max-width:720px;margin:auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
.header{padding:8px 2px 16px}.header h1{margin:0;font-size:28px}.badge{font-size:11px;background:#fff;color:#111;padding:3px 7px;border-radius:999px;vertical-align:middle}
.header p,.small{color:var(--muted);font-size:13px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:92px;resize:none;border:1px solid var(--line);background:#111114;color:var(--text);border-radius:14px;font-size:17px;padding:13px 14px;outline:none;line-height:1.5}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:2px 0}.chip{min-width:0}.chip{white-space:nowrap;background:#232328;border:1px solid #303036;color:#ddd;padding:9px 11px;border-radius:999px;font-size:13px;font-weight:700}.chip.active{background:#f1f1f3;color:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{border:0;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:700;cursor:pointer}
.primary{width:100%;background:var(--accent);color:#111;margin-top:12px;font-size:18px;padding:15px}
.secondary{background:#27272c;color:var(--text);border:1px solid #34343a}.ghost{background:#202024;color:var(--text);border:1px solid #303036}
.output{display:flex;flex-direction:column;gap:10px}.result{background:#111114;border:1px solid var(--line);border-radius:16px;padding:14px}
.resultText{font-size:17px;line-height:1.65;white-space:pre-wrap;margin-bottom:12px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:10px;font-size:14px}
.keywords{margin-top:10px;color:#777;font-size:12px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(18px);background:#fff;color:#111;padding:10px 14px;border-radius:999px;font-weight:700;opacity:0;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%)}
.footer{color:#777;font-size:12px;text-align:center;padding:8px}

@media(max-width:520px){
 .chips{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
 .chip{padding:9px 4px;font-size:12px}
 .header h1{font-size:27px}
}

.strategy{display:inline-block;margin-bottom:8px;padding:4px 9px;border:1px solid #3a3a42;border-radius:999px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="app">
 <div class="header"><h1>九天廢話文學生成器 <span class="badge">V3.1</span></h1><p>事件因果＋九天笑點庫＋三路笑點生成。全離線，不需要模型。</p></div>
 <div class="card">
  <label>對方原話／主題</label><textarea id="topic" placeholder="貼上對方原話……"></textarea>
  <label style="margin-top:12px">風格</label>
  <div class="chips" id="chips">
   <button class="chip active" data-style="normal">經典廢</button><button class="chip" data-style="argue">回嘴廢</button>
   <button class="chip" data-style="philo">哲學廢</button><button class="chip" data-style="science">研究廢</button>
   <button class="chip" data-style="mystic">高深廢</button><button class="chip" data-style="romance">浪漫廢</button>
   <button class="chip" data-style="god">神級廢</button>
  </div>
  <div class="row"><button class="secondary" id="sampleBtn">換個範例</button><button class="ghost" id="clearBtn">清空</button></div>
  <button class="primary" id="generateBtn">生成 3 句</button>
  <div class="keywords" id="keywords"></div>
 </div>
 <div class="card"><label>生成結果</label><div class="output" id="output"></div></div>
 <div class="footer">V3.1：同一事件分三條笑路生成，避免三句只是換皮重複。</div>
</div><div class="toast" id="toast">已複製</div>
<script>
const $=id=>document.getElementById(id), topicEl=$('topic'), output=$('output'), toast=$('toast'), keywordsEl=$('keywords');
let style='normal'; const recent=new Set(); const recentOrder=[];

const samples=[
'你整天研究這些賺到錢了嗎？','你是不是有病？','你到底在講什麼？',
'我忘記了，你那個繩子不夠力，頭放下去結果身體扯斷了',
'馬賽克打好了，不用謝我','躲好，子彈飛啊飛的',
'走在香水雨裡，濕的是我的身，思的是你的人',
'情愛是互相吸引，互相吸引又是為了什麼？'
];

const stop = new Set('我你妳他她它我們你們他們這那這個那個一個一些就是只是但是不過因為所以如果然後結果現在目前已經還是沒有不是可以可能真的其實到底怎麼什麼為什麼一下這樣那樣的了嗎呢啊呀喔哦吧在有又都也很太再就把被讓跟和與或而才會能要想說講問看做去來上下一樣時候事情問題地方'.split(''));

const lexicon = [
'香水雨','街燈','浪漫','芬芳氣息','氣息','走進妳的心裡','走進你的心裡','心裡','心裏','淋濕','淋溼','洗淨',
'婚姻','契約','情愛','互相吸引','吸引','繩子不夠力','繩子','不夠力','頭放下去','頭','身體扯斷','身體','扯斷',
'子彈飛','子彈','躲好','馬賽克','研究','賺到錢','賺錢','神助的力量','神助','力量','經典','感應','板規',
'熬夜','喝水','胃口','困難','背後','生病','答案','時間','成功','失敗','離開','回來','忘記','記得'
];

const semanticRules = [
 {test:/繩子[^，。！？]{0,8}(不夠力|不夠|斷|撐不住)/, role:'cause', make:m=>`繩子${m[1]}`},
 {test:/頭[^，。！？]{0,6}(放下去|放下|低下|伸下去)/, role:'action', make:m=>`頭${m[1]}`},
 {test:/身體[^，。！？]{0,8}(扯斷|斷了|斷掉|被扯斷)/, role:'result', make:m=>`身體${m[1]}`},
 {test:/(馬賽克)[^，。！？]{0,8}(打好|打了|遮住)/, role:'action', make:m=>`${m[1]}${m[2]}`},
 {test:/(子彈)[^，。！？]{0,8}(飛|飛過去|飛來飛去)/, role:'event', make:m=>`${m[1]}${m[2]}`},
 {test:/(研究)[^，。！？]{0,12}(賺到錢|賺錢)/, role:'question', make:m=>`${m[1]}能不能${m[2]}`},
 {test:/(板規)[^，。！？]{0,12}(感應)/, role:'constraint', make:m=>`${m[1]}不能講${m[2]}`},
 {test:/(經典)[^，。！？]{0,15}(神助|力量|感應)/, role:'experience', make:m=>`讀${m[1]}感到${m[2]}`},
 {test:/(婚姻)[^，。！？]{0,8}(契約)/, role:'definition', make:m=>`${m[1]}是${m[2]}`},
 {test:/(情愛|愛情)[^，。！？]{0,8}(互相吸引|吸引)/, role:'definition', make:m=>`${m[1]}是${m[2]}`},
 {test:/(香水雨)[^，。！？]{0,12}(淋|落|濕)/, role:'event', make:m=>`${m[1]}${m[2]}在身上`},
 {test:/(走進|進入)[^，。！？]{0,5}(妳|你)[^，。！？]{0,4}(心裡|心裏)/, role:'goal', make:m=>`${m[1]}${m[2]}的${m[3]}`}
];

function clean(s){return (s||'').replace(/\s+/g,' ').trim().replace(/[。！？!?]+$/,'')}
function uniq(arr){return [...new Set(arr.filter(Boolean))]}
function parseEvent(raw){
 const s=clean(raw), slots={cause:'',action:'',result:'',event:'',question:'',constraint:'',experience:'',definition:'',goal:''}, phrases=[];
 semanticRules.forEach(r=>{
   const m=s.match(r.test);
   if(m){const v=r.make(m); if(!slots[r.role])slots[r.role]=v; phrases.push(v)}
 });
 const clauses=s.split(/[，,。；;！？!?]+/).map(x=>x.trim()).filter(x=>x.length>=2);
 // Generic causal/action/result hints
 clauses.forEach(c=>{
   if(!slots.cause && /(因為|由於|不夠|不能|沒辦法|太|不足|壞|斷)/.test(c)) slots.cause=c.replace(/^(因為|由於)/,'');
   if(!slots.result && /(結果|所以|因此|最後|變成|扯斷|斷了|沒了|成功|失敗)/.test(c)) slots.result=c.replace(/^(結果|所以|因此|最後)/,'');
   if(!slots.action && /(放|打|走|說|問|看|研究|淋|喝|睡|飛|躲|洗|讀)/.test(c)) slots.action=c;
 });
 // Preserve compact semantic phrases but do not let long clauses dominate.
 lexicon.sort((a,b)=>b.length-a.length).forEach(w=>{if(s.includes(w))phrases.push(w)});
 phrases.push(...clauses.filter(x=>x.length<=10));
 return {raw:s,slots,phrases:uniq(phrases).slice(0,10)};
}
function extract(raw){return parseEvent(raw).phrases}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function pair(k){return [k[0]||'這件事',k[1]||k[0]||'這件事',k[2]||k[1]||k[0]||'這件事']}
function addRecent(x){recent.add(x);recentOrder.push(x);while(recentOrder.length>60){recent.delete(recentOrder.shift())}}
function chooseUnique(builders,ctx){
 for(let i=0;i<80;i++){const x=pick(builders)(ctx);if(!recent.has(x)){addRecent(x);return x}}
 const x=pick(builders)(ctx);addRecent(x);return x;
}
function slot(c,name,fallback){
 const v=c.event.slots[name];
 return v || fallback || c.a || '這件事';
}
function cause(c){return slot(c,'cause',c.a)}
function action(c){return slot(c,'action',c.b)}
function result(c){return slot(c,'result',c.c)}
function focus(c){return c.event.slots.definition||c.event.slots.question||c.event.slots.event||cause(c)}
function punch(c){
 const r=result(c), ca=cause(c);
 return pick([
   `至少這次不是猜測，是事情自己把答案演了一遍`,
   `到這裡，前面的懷疑基本上已經被現場本人簽收了`,
   `這個結論最大的優點，就是結果已經替它先發表了`,
   `事情發展到這裡，連反駁都得先承認它確實發展到這裡`,
   `原本只是說法，現在至少多了一份由結果親自提供的證詞`,
   `${r}一出現，${ca}就從意見突然升級成了案例`
 ])
}


const JIUTIAN_HUMOR = {
 evidence:[
  c=>`原本「${cause(c)}」只是說法，等${result(c)}出現以後，這句話突然有了物證。`,
  c=>`經現場實測，${cause(c)}確實值得注意。至於為什麼一定要用${result(c)}來驗證，目前仍在檢討實驗成本。`,
  c=>`${result(c)}一出現，${cause(c)}就從個人意見升級成案例報告，連摘要都不用重寫。`,
  c=>`本來還能懷疑${cause(c)}，直到${result(c)}親自到場，懷疑突然失去了主要工作。`
 ],
 blame:[
  c=>`不要怪${cause(c)}，它從頭到尾也沒保證自己不會導向${result(c)}；真正勇敢的是大家居然願意替它做實測。`,
  c=>`${cause(c)}其實很無辜，人家只是維持自己的狀態，是${action(c)}主動把事情推進到${result(c)}。`,
  c=>`這件事不能全怪${cause(c)}。畢竟${result(c)}發生以前，大家都有充分時間相信它不會發生。`,
  c=>`與其責怪${cause(c)}，不如尊重它的誠實：最後至少真的用${result(c)}證明自己沒有虛假宣傳。`
 ],
 redirect:[
  c=>`${result(c)}以前大家都在研究${cause(c)}；${result(c)}以後，我覺得研究方向可以先改成${result(c)}。`,
  c=>`事情走到${result(c)}這一步，${cause(c)}還重不重要可以晚點討論，現在比較值得確認的是事情為什麼已經走到這一步。`,
  c=>`本來的問題是${cause(c)}，等${result(c)}出現後，恭喜，我們成功獲得了一個比原問題更新的問題。`,
  c=>`${action(c)}之前焦點還在${cause(c)}；${result(c)}之後焦點沒消失，只是被迫換了一個比較急的焦點。`
 ],
 official:[
  c=>`經初步調查：${cause(c)}為前置條件，${action(c)}為操作過程，${result(c)}為最終結果。本案最大突破，是終於知道結果欄要填什麼。`,
  c=>`依現場資料研判，${cause(c)}與${result(c)}先後出現。相關單位表示，結果既已發生，後續將持續研究它為什麼已經發生。`,
  c=>`本案經查，${action(c)}後確有${result(c)}情形。至於是否與${cause(c)}有關，目前最支持相關性的證據，就是它們剛好全在同一件事裡。`,
  c=>`調查報告指出：${result(c)}發生率在發生前為零，發生後立即升至本案的一百％。`
 ],
 hindsight:[
  c=>`${result(c)}發生以前，${cause(c)}叫提醒；${result(c)}發生以後，同一句話突然改名叫「我早就說過」。`,
  c=>`事後回頭看，${cause(c)}確實很可疑；最大的證據就是我們現在正在事後回頭看。`,
  c=>`如果早知道${result(c)}會發生，大家一定會更早知道；問題是通常要等它發生，才知道原來早知道比較好。`,
  c=>`${action(c)}以前沒人能確定${result(c)}；現在能確定了，只是這份確定來得稍微晚了一點。`
 ],
 literal:[
  c=>`${cause(c)}最大的問題，就是它真的${cause(c).includes('不夠')?'不太夠':'成了問題'}；${result(c)}最大的貢獻，就是把這句廢話變得突然很難反駁。`,
  c=>`如果${result(c)}沒有發生，那它就是沒發生；現在既然發生了，最大的變化就是不能再使用前半句。`,
  c=>`${action(c)}做完之後出現${result(c)}，這告訴我們一個重要道理：做完之前，確實還沒有做完。`,
  c=>`少了${cause(c)}，這句話會少一個原因；少了${result(c)}，這件事至少會少一個結果。`
 ],
 meta:[
  c=>`${cause(c)}跟${result(c)}誰比較重要我不知道，但少掉任何一個，這句廢話都會短很多。`,
  c=>`我本來想深入分析${cause(c)}，後來看到${result(c)}，突然覺得深入之前先確認一下能不能安全回來。`,
  c=>`這件事最完整的地方，是${cause(c)}、${action(c)}和${result(c)}一個都沒缺；缺的是一個比較正常的發展。`,
  c=>`如果你覺得這段分析沒有幫助，至少它成功證明：沒有幫助的分析也可以分析得很完整。`
 ]
};

const STRATEGY_NAMES={
 evidence:'物證型', blame:'甩鍋型', redirect:'轉移焦點型',
 official:'官方調查型', hindsight:'事後諸葛型', literal:'字面暴擊型', meta:'自我吐槽型'
};

const STYLE_STRATEGIES={
 normal:['literal','hindsight','redirect','evidence'],
 argue:['blame','redirect','evidence','meta'],
 philo:['hindsight','literal','meta','redirect'],
 science:['official','evidence','literal','redirect'],
 mystic:['hindsight','meta','redirect','evidence'],
 romance:['hindsight','redirect','meta','literal'],
 god:['evidence','blame','redirect','official','hindsight','literal','meta']
};

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function threeStrategies(style){
 const pool=STYLE_STRATEGIES[style]||STYLE_STRATEGIES.god;
 return shuffled(pool).slice(0,3);
}
function humorLine(strategy,ctx){
 const bank=JIUTIAN_HUMOR[strategy]||JIUTIAN_HUMOR.meta;
 return chooseUnique(bank,ctx);
}
const B={
normal:[
 c=>`${cause(c)}本來還只是一種狀態；等${action(c)}之後又出現${result(c)}，至少可以確定——事情確實沒有停在原地。`,
 c=>`先有${cause(c)}，再有${action(c)}，最後到了${result(c)}。整件事最清楚的地方，就是每一步都發生在它發生之後。`,
 c=>`${action(c)}以前，${result(c)}還只是沒有發生；${action(c)}以後它真的出現了，這表示「還沒發生」確實有它的保存期限。`,
 c=>`${focus(c)}最大的特色，就是一旦後面真的接上${result(c)}，前面那句話突然就比剛才更像前情提要。`,
 c=>`如果沒有${cause(c)}，後面未必會照現在這樣走；既然現在走成了${result(c)}，至少現在就是現在這個結果。`,
 c=>`${cause(c)}、${action(c)}、${result(c)}三件事放在一起，最重要的發現是：它們現在確實已經被放在一起了。`
],
argue:[
 c=>`你可以說${cause(c)}不重要，但等${result(c)}真的出現，再說它完全不重要，就得先跟結果本人談談。`,
 c=>`你先別急著反駁${cause(c)}。前面還能吵，等${result(c)}都出來了，後面已經開始拿實物參加辯論。`,
 c=>`我不是說${cause(c)}一定造成${result(c)}，我只是說兩件事都發生完以後，硬說什麼都沒發生會比較需要勇氣。`,
 c=>`你問${action(c)}到底有沒有影響，我不知道；但如果完全沒影響，${result(c)}至少出現得非常有參與感。`,
 c=>`當然可以繼續討論${cause(c)}，只是${result(c)}已經先到現場坐好了，現在輪到理論慢慢追上它。`,
 c=>`如果你的結論是${cause(c)}跟${result(c)}沒關係，我尊重；畢竟結果都出來了，意見自由還是要保留。`
],
philo:[
 c=>`${cause(c)}是因，${result(c)}是果嗎？未必。但當${action(c)}夾在中間時，人至少會開始懷疑：這三位是不是一起來的。`,
 c=>`在${action(c)}以前，${result(c)}存在於可能；在它發生以後，可能少了一個，回憶多了一個。`,
 c=>`人總想知道${result(c)}為何發生，卻忘了在它發生以前，它最大的特徵正是還沒有發生。`,
 c=>`${cause(c)}讓人思考原因，${result(c)}讓人思考結果；真正玄妙的是，結果出來以後大家突然都比較會分析原因。`,
 c=>`如果時間能倒流，${result(c)}也許還沒發生；可惜我們現在站的位置，剛好是在它已經發生的這一邊。`,
 c=>`${action(c)}只是一個動作，直到${result(c)}出現，它才突然獲得了一段值得被回頭解釋的人生。`
],
science:[
 c=>`初步實驗顯示：在${cause(c)}的條件下進行${action(c)}，隨後觀察到${result(c)}。目前最可靠的結論是——這次實驗至少真的做出結果了。`,
 c=>`研究團隊原本只掌握${cause(c)}這項條件；直到${result(c)}出現，數據突然從「可能有事」進入「確實有事」階段。`,
 c=>`根據單一案例觀察，${action(c)}後出現${result(c)}。樣本數雖然只有一次，但對當事人來說已經嫌多了。`,
 c=>`目前尚不能證明${cause(c)}必然導致${result(c)}；不過結果既然已經發生，這次至少不用再招募第二位受試者確認有沒有發生。`,

function context(raw){
 const event=parseEvent(raw), k=event.phrases, [a,b,c]=pair(k);
 const ctx={raw:clean(raw)||'這件事',k,a,b,c,event};
 const s=event.slots;
 const chain=[s.cause&&('原因/狀態：'+s.cause),s.action&&('動作：'+s.action),s.result&&('結果：'+s.result)].filter(Boolean);
 keywordsEl.textContent=chain.length?'事件鏈｜'+chain.join(' → '):'抓到的語意：'+k.slice(0,6).join('・');
 return ctx;
}
function generateOne(ctx){return chooseUnique(B[style],ctx)}
function generate(){
 const raw=input.value.trim();
 if(!raw){input.focus();return}
 const c=context(raw);
 const strategies=threeStrategies(style);
 results.innerHTML='';
 strategies.forEach(strategy=>{
   const text=humorLine(strategy,c);
   const card=document.createElement('div');
   card.className='result';
   const tag=document.createElement('div');
   tag.className='strategy';
   tag.textContent=STRATEGY_NAMES[strategy]||'九天型';
   const p=document.createElement('div');
   p.className='text';
   p.textContent=text;
   const actions=document.createElement('div');
   actions.className='actions';
   const copy=document.createElement('button');
   copy.textContent='複製這句';
   copy.onclick=()=>navigator.clipboard.writeText(text);
   const swap=document.createElement('button');
   swap.textContent='換一句';
   swap.onclick=()=>{
     const next=humorLine(strategy,c);
     p.textContent=next;
     copy.onclick=()=>navigator.clipboard.writeText(next);
   };
   actions.append(copy,swap);
   card.append(tag,p,actions);
   results.append(card);
 });
}
function render(items,ctx){
 output.innerHTML='';
 items.forEach(text=>{
  const box=document.createElement('div');box.className='result';
  const t=document.createElement('div');t.className='resultText';t.textContent=text;
  const a=document.createElement('div');a.className='actions';
  const cp=document.createElement('button');cp.className='secondary';cp.textContent='複製這句';
  const ag=document.createElement('button');ag.className='ghost';ag.textContent='換一句';
  const bind=x=>{cp.onclick=()=>copyText(x);ag.onclick=()=>{let n=generateOne(ctx);t.textContent=n;bind(n)}};
  bind(text);a.append(cp,ag);box.append(t,a);output.append(box);
 });
}
async function copyText(text){
 try{await navigator.clipboard.writeText(text)}catch(e){let ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
 toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)
}
$('generateBtn').onclick=generate;
$('clearBtn').onclick=()=>{topicEl.value='';keywordsEl.textContent='';output.innerHTML='';topicEl.focus()};
$('sampleBtn').onclick=()=>{topicEl.value=pick(samples);generate()};
$('chips').addEventListener('click',e=>{if(!e.target.classList.contains('chip'))return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');style=e.target.dataset.style;generate()});
topicEl.value='我忘記了，你那個繩子不夠力，頭放下去結果身體扯斷了';generate();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
